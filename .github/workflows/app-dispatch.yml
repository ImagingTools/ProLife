# NOTE: This workflow needs to be updated to work without submodules.
# The 3rdParty folder and submodules have been removed from the repository.
# Dependencies must now be managed externally via environment variables.
# This workflow is currently non-functional and requires significant updates.

name: App Dispatch Release

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Branch to release from'
        required: true
        default: 'main'
      target_tag:
        description: 'Target release tag (e.g., v1.2.3)'
        required: true
      base_tag:
        description: 'Base tag for changelog generation (e.g., v1.2.2)'
        required: true
      # Submodule versions
      acf_version:
        description: 'Acf version (tag, branch, or "latest")'
        required: false
        default: 'latest'
      acfsln_version:
        description: 'AcfSln version (tag, branch, or "latest")'
        required: false
        default: 'latest'
      imtcore_version:
        description: 'ImtCore version (tag, branch, or "latest")'
        required: false
        default: 'latest'
      lisa_version:
        description: 'Lisa version (tag, branch, or "latest")'
        required: false
        default: 'latest'
      puma_version:
        description: 'Puma version (tag, branch, or "latest")'
        required: false
        default: 'latest'
      agentino_version:
        description: 'Agentino version (tag, branch, or "latest")'
        required: false
        default: 'latest'
      dry_run:
        description: 'Dry run (skip tagging and release)'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: app_token
        run: |
          echo "Generating GitHub App token..."

          # Get the JWT token
          NOW=$(date +%s)
          IAT=$((NOW - 60))
          EXP=$((NOW + 600))

          # Validate APP_ID is numeric
          APP_ID="${{ secrets.APP_ID }}"
          if ! [[ "$APP_ID" =~ ^[0-9]+$ ]]; then
            echo "Error: APP_ID must be numeric"
            exit 1
          fi

          HEADER='{"alg":"RS256","typ":"JWT"}'
          PAYLOAD='{"iat":'$IAT',"exp":'$EXP',"iss":"'$APP_ID'"}'

          HEADER_B64=$(echo -n "$HEADER" | base64 | tr -d '=' | \
            tr '/+' '_-' | tr -d '\n')
          PAYLOAD_B64=$(echo -n "$PAYLOAD" | base64 | tr -d '=' | \
            tr '/+' '_-' | tr -d '\n')

          # Sign with private key
          SIGNATURE=$(echo -n "${HEADER_B64}.${PAYLOAD_B64}" | \
            openssl dgst -binary -sha256 \
            -sign <(echo "${{ secrets.APP_PRIVATE_KEY }}") | \
            base64 | tr -d '=' | tr '/+' '_-' | tr -d '\n')

          JWT="${HEADER_B64}.${PAYLOAD_B64}.${SIGNATURE}"

          # Exchange JWT for installation access token
          INSTALL_ID="${{ secrets.APP_INSTALLATION_ID }}"
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/$INSTALL_ID/access_tokens")

          TOKEN=$(echo "$RESPONSE" | jq -r .token)

          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to generate GitHub App token"
            echo "Please verify APP_ID, APP_INSTALLATION_ID, and" \
              "APP_PRIVATE_KEY secrets are correctly configured"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "Token generated successfully"

      - name: Dispatch release workflow
        run: |
          echo "Dispatching release workflow with submodule versions..."
          gh workflow run .github/workflows/release.yml \
            --ref ${{ inputs.release_branch }} \
            -f release_branch="${{ inputs.release_branch }}" \
            -f target_tag="${{ inputs.target_tag }}" \
            -f base_tag="${{ inputs.base_tag }}" \
            -f acf_version="${{ inputs.acf_version }}" \
            -f acfsln_version="${{ inputs.acfsln_version }}" \
            -f imtcore_version="${{ inputs.imtcore_version }}" \
            -f lisa_version="${{ inputs.lisa_version }}" \
            -f puma_version="${{ inputs.puma_version }}" \
            -f agentino_version="${{ inputs.agentino_version }}" \
            -f dry_run="${{ inputs.dry_run }}"
          echo "Release workflow dispatched successfully"
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Summary
        run: |
          TAG="${{ inputs.target_tag }}"
          BASE="${{ inputs.base_tag }}"
          BRANCH="${{ inputs.release_branch }}"
          DRY="${{ inputs.dry_run }}"
          echo "## App Dispatch Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release workflow has been dispatched with the" \
            "following parameters:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Tag:** $TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Base Tag:** $BASE" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** $BRANCH" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run:** $DRY" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Submodule Versions:" >> $GITHUB_STEP_SUMMARY
          echo "- **Acf:** ${{ inputs.acf_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **AcfSln:** ${{ inputs.acfsln_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ImtCore:** ${{ inputs.imtcore_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Lisa:** ${{ inputs.lisa_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Puma:** ${{ inputs.puma_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Agentino:** ${{ inputs.agentino_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ACTIONS_URL="../../actions/workflows/release.yml"
          echo "Check the [Actions tab]($ACTIONS_URL) to monitor" \
            "the release workflow." >> $GITHUB_STEP_SUMMARY
