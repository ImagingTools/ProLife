name: Clone Repository Variables from ImtCore

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source repository to clone variables from (owner/repo)'
        required: false
        default: 'ImagingTools/ImtCore'
      dry_run:
        description: 'Dry run: list variables without creating them'
        required: false
        type: boolean
        default: false

permissions:
  actions: write

jobs:
  clone-variables:
    name: Clone Repository Variables
    runs-on: ubuntu-latest

    steps:
      - name: Clone variables from source repository
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          TARGET_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          echo "📋 Cloning repository variables"
          echo "  Source: $SOURCE_REPO"
          echo "  Target: $TARGET_REPO"
          echo ""

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "❌ Error: PERSONAL_ACCESS_TOKEN secret is not configured."
            echo "Please add a Personal Access Token with 'repo' scope as the PERSONAL_ACCESS_TOKEN secret."
            exit 1
          fi

          # Fetch all variables from source repository (paginated)
          PAGE=1
          PER_PAGE=30
          ALL_VARIABLES="[]"

          while true; do
            RESPONSE=$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$SOURCE_REPO/actions/variables?per_page=$PER_PAGE&page=$PAGE")

            if ! echo "$RESPONSE" | jq empty 2>/dev/null; then
              echo "❌ Failed to fetch variables from $SOURCE_REPO (invalid response)"
              echo "Response: $RESPONSE"
              exit 1
            fi

            # GitHub API returns { "total_count": N, "variables": [...] }
            VARIABLES=$(echo "$RESPONSE" | jq '.variables // []')
            COUNT=$(echo "$VARIABLES" | jq 'length')

            ALL_VARIABLES=$(echo "$ALL_VARIABLES $VARIABLES" | jq -s 'add')

            if [ "$COUNT" -lt "$PER_PAGE" ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          TOTAL=$(echo "$ALL_VARIABLES" | jq 'length')
          echo "Found $TOTAL variable(s) in $SOURCE_REPO:"
          echo ""

          if [ "$TOTAL" -eq 0 ]; then
            echo "No variables found in source repository."
            exit 0
          fi

          # List all variables
          echo "$ALL_VARIABLES" | jq -r '.[] | "  - \(.name) = \(.value)"'
          echo ""

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 Dry run mode: variables listed above would be created/updated in $TARGET_REPO"
            exit 0
          fi

          # Create or update each variable in the target repository
          CREATED=0
          UPDATED=0
          FAILED=0

          while IFS= read -r VARIABLE; do
            NAME=$(echo "$VARIABLE" | jq -r '.name')
            VALUE=$(echo "$VARIABLE" | jq -r '.value')

            # Try to update (PATCH) first, then create (POST) if it doesn't exist
            HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg value "$VALUE" '{value: $value}')" \
              "https://api.github.com/repos/$TARGET_REPO/actions/variables/$NAME")

            if [ "$HTTP_STATUS" = "204" ]; then
              echo "✅ Updated: $NAME"
              UPDATED=$((UPDATED + 1))
            elif [ "$HTTP_STATUS" = "404" ]; then
              # Variable doesn't exist, create it
              CREATE_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/json" \
                --data "$(jq -n --arg name "$NAME" --arg value "$VALUE" '{name: $name, value: $value}')" \
                "https://api.github.com/repos/$TARGET_REPO/actions/variables")

              if [ "$CREATE_STATUS" = "201" ]; then
                echo "✅ Created: $NAME"
                CREATED=$((CREATED + 1))
              else
                echo "❌ Failed to create $NAME (HTTP $CREATE_STATUS)"
                FAILED=$((FAILED + 1))
              fi
            else
              echo "❌ Failed to update $NAME (HTTP $HTTP_STATUS)"
              FAILED=$((FAILED + 1))
            fi
          done < <(echo "$ALL_VARIABLES" | jq -c '.[]')

          echo ""
          echo "📊 Summary:"
          echo "  Created: $CREATED"
          echo "  Updated: $UPDATED"
          echo "  Failed:  $FAILED"

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "⚠️ Some variables failed to clone. Please check the logs above."
            exit 1
          fi

          echo ""
          echo "✅ Successfully cloned $((CREATED + UPDATED)) variable(s) from $SOURCE_REPO to $TARGET_REPO"
