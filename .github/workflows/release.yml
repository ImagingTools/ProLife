name: Release Preparation

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Branch to release from'
        required: true
        default: 'main'
      target_tag:
        description: 'Target release tag (e.g., v1.2.3)'
        required: true
      base_tag:
        description: 'Base tag for changelog generation (e.g., v1.2.2)'
        required: true
      # Submodule versions
      acf_version:
        description: 'Acf version (tag, branch, or "latest")'
        required: false
        default: 'latest'
      acfsln_version:
        description: 'AcfSln version (tag, branch, or "latest")'
        required: false
        default: 'latest'
      imtcore_version:
        description: 'ImtCore version (tag, branch, or "latest")'
        required: false
        default: 'latest'
      lisa_version:
        description: 'Lisa version (tag, branch, or "latest")'
        required: false
        default: 'latest'
      puma_version:
        description: 'Puma version (tag, branch, or "latest")'
        required: false
        default: 'latest'
      agentino_version:
        description: 'Agentino version (tag, branch, or "latest")'
        required: false
        default: 'latest'
      dry_run:
        description: 'Dry run (skip tagging and release)'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0  # Fetch full history for changelog generation
          submodules: recursive
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Update submodule versions
        run: |
          echo "Updating submodule versions..."
          
          # Function to update a submodule
          update_submodule() {
            local path=$1
            local version=$2
            local name=$(basename $path)
            
            if [ ! -d "$path" ]; then
              echo "⚠️  Submodule $name not found at $path"
              return
            fi
            
            cd "$path"
            
            # If version is "latest", find the latest semantic version tag
            if [ "$version" == "latest" ]; then
              echo "  Finding latest version for $name..."
              git fetch --tags --quiet
              version=$(git tag -l | grep -E "^v?[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -1)
              
              if [ -z "$version" ]; then
                echo "  ⚠️  No semantic version tags found for $name, keeping current version"
                cd - > /dev/null
                return
              fi
              echo "  Latest version for $name: $version"
            fi
            
            # Fetch and checkout the specified version
            echo "  Updating $name to $version..."
            git fetch --all --tags --quiet
            git checkout "$version" --quiet 2>/dev/null || {
              echo "  ❌ Failed to checkout $version for $name"
              cd - > /dev/null
              return 1
            }
            
            cd - > /dev/null
            
            # Stage the submodule change
            git add "$path"
            echo "  ✅ $name updated to $version"
          }
          
          # Update each submodule
          update_submodule "3rdParty/Acf" "${{ inputs.acf_version }}"
          update_submodule "3rdParty/AcfSln" "${{ inputs.acfsln_version }}"
          update_submodule "3rdParty/ImtCore" "${{ inputs.imtcore_version }}"
          update_submodule "3rdParty/Lisa" "${{ inputs.lisa_version }}"
          update_submodule "3rdParty/Puma" "${{ inputs.puma_version }}"
          update_submodule "3rdParty/Agentino" "${{ inputs.agentino_version }}"
          
          echo ""
          echo "✅ Submodule updates complete"

      - name: Validate submodules
        run: |
          echo "Validating submodules..."
          chmod +x tools/validate-release.sh
          ./tools/validate-release.sh validate ${{ inputs.target_tag }} || true
          echo "Submodule validation complete"

      - name: Generate submodule report
        run: |
          echo "Generating submodule version report..."
          ./tools/validate-release.sh report SUBMODULE_VERSIONS.md
          cat SUBMODULE_VERSIONS.md

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install conventional-changelog-cli
        run: npm install -g conventional-changelog-cli@5.0.0

      - name: Generate changelog
        run: |
          echo "Generating changelog from ${{ inputs.base_tag }} to HEAD..."
          conventional-changelog -p angular -i CHANGELOG.md -s -r 0
          echo "Changelog generated successfully"

      - name: Extract version from tag
        id: version
        run: |
          # Remove 'v' prefix from tag to get version number
          VERSION="${{ inputs.target_tag }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Bump version in CMakeLists.txt
        run: |
          # Update version in CMakeLists.txt
          # CUSTOMIZATION: Modify this sed pattern if your version
          # placeholder is different
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/project(ProLifeAll VERSION [0-9.]*)/project(ProLifeAll VERSION $VERSION)/" \
            Build/CMake/CMakeLists.txt
          echo "Version bumped to $VERSION in Build/CMake/CMakeLists.txt"

          # Verify the change
          grep "project(ProLifeAll VERSION" Build/CMake/CMakeLists.txt

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        id: commit
        run: |
          git add CHANGELOG.md Build/CMake/CMakeLists.txt SUBMODULE_VERSIONS.md
          git add 3rdParty/  # Add all submodule changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: prepare release ${{ inputs.target_tag }}" \
              -m "Submodule versions:" \
              -m "- Acf: ${{ inputs.acf_version }}" \
              -m "- AcfSln: ${{ inputs.acfsln_version }}" \
              -m "- ImtCore: ${{ inputs.imtcore_version }}" \
              -m "- Lisa: ${{ inputs.lisa_version }}" \
              -m "- Puma: ${{ inputs.puma_version }}" \
              -m "- Agentino: ${{ inputs.agentino_version }}"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes committed successfully"
          fi

      - name: Push changes
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git push origin ${{ inputs.release_branch }}
          BRANCH="${{ inputs.release_branch }}"
          echo "Changes pushed to $BRANCH"

      - name: Create and push tag
        if: |
          inputs.dry_run == 'false' &&
          steps.commit.outputs.has_changes == 'true'
        run: |
          TAG="${{ inputs.target_tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Tag $TAG created and pushed"

      - name: Build artifacts
        run: |
          echo "Building artifacts..."
          # CUSTOMIZATION: Add your actual build commands here
          # For now, we'll create a placeholder artifact
          mkdir -p artifacts
          echo "ProLife Release ${{ inputs.target_tag }}" > artifacts/README.txt
          echo "Build timestamp: $(date)" >> artifacts/README.txt
          tar -czf prolife-${{ inputs.target_tag }}.tar.gz artifacts/
          echo "Artifacts built successfully"

      - name: Upload artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: prolife-release-${{ inputs.target_tag }}
          path: prolife-${{ inputs.target_tag }}.tar.gz
          retention-days: 90

      - name: Create GitHub Release
        if: inputs.dry_run == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.target_tag }}
          name: Release ${{ inputs.target_tag }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            prolife-${{ inputs.target_tag }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          TAG="${{ inputs.target_tag }}"
          BASE="${{ inputs.base_tag }}"
          BRANCH="${{ inputs.release_branch }}"
          DRY="${{ inputs.dry_run }}"
          echo "## Release Preparation Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Tag:** $TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Base Tag:** $BASE" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** $BRANCH" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run:** $DRY" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Submodule Versions:" >> $GITHUB_STEP_SUMMARY
          echo "- **Acf:** ${{ inputs.acf_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **AcfSln:** ${{ inputs.acfsln_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ImtCore:** ${{ inputs.imtcore_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Lisa:** ${{ inputs.lisa_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Puma:** ${{ inputs.puma_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Agentino:** ${{ inputs.agentino_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$DRY" == "true" ]; then
            echo "✅ Dry run completed - no tag or release created" \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Release $TAG published" >> $GITHUB_STEP_SUMMARY
          fi

  build-windows:
    runs-on: windows-2022
    needs: release
    if: inputs.dry_run == 'false'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_tag }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Install Qt 6.8.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets qtnetworkauth'
          cache: true

      - name: Install Ninja and Inno Setup
        run: |
          choco install ninja innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Acf
        if: hashFiles('3rdParty/Acf/Build/CMake/CMakeLists.txt') != ''
        run: |
          cd 3rdParty/Acf
          # Generate version files
          if (Test-Path "Build/Git/GenerateVersion.bat") {
            Write-Host "Generating version files for Acf..."
            cmd /c "Build\Git\GenerateVersion.bat"
          }
          mkdir build -Force
          cd build
          cmake ../Build/CMake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
          Write-Host "✅ Acf built successfully"
        shell: pwsh

      - name: Build AcfSln
        if: hashFiles('3rdParty/AcfSln/Build/CMake/CMakeLists.txt') != ''
        run: |
          cd 3rdParty/AcfSln
          # Generate version files
          if (Test-Path "Build/Git/UpdateVersion.bat") {
            Write-Host "Generating version files for AcfSln..."
            cmd /c "Build\Git\UpdateVersion.bat"
          }
          mkdir build -Force
          cd build
          cmake ../Build/CMake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
          Write-Host "✅ AcfSln built successfully"
        shell: pwsh

      - name: Build ImtCore
        if: hashFiles('3rdParty/ImtCore/Build/CMake/CMakeLists.txt') != ''
        run: |
          cd 3rdParty/ImtCore
          # Generate version files
          if (Test-Path "Build/Git/UpdateVersion.bat") {
            Write-Host "Generating version files for ImtCore..."
            cmd /c "Build\Git\UpdateVersion.bat"
          }
          mkdir build -Force
          cd build
          cmake ../Build/CMake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
          Write-Host "✅ ImtCore built successfully"
        shell: pwsh

      - name: Build Lisa
        if: hashFiles('3rdParty/Lisa/Build/CMake/CMakeLists.txt') != ''
        run: |
          cd 3rdParty/Lisa
          # Generate version files
          if (Test-Path "Build/Git/UpdateVersion.bat") {
            Write-Host "Generating version files for Lisa..."
            cmd /c "Build\Git\UpdateVersion.bat"
          }
          mkdir build -Force
          cd build
          cmake ../Build/CMake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
          Write-Host "✅ Lisa built successfully"
        shell: pwsh

      - name: Build Puma
        if: hashFiles('3rdParty/Puma/Build/CMake/CMakeLists.txt') != ''
        run: |
          cd 3rdParty/Puma
          # Generate version files
          if (Test-Path "Build/Git/UpdateVersion.bat") {
            Write-Host "Generating version files for Puma..."
            cmd /c "Build\Git\UpdateVersion.bat"
          }
          mkdir build -Force
          cd build
          cmake ../Build/CMake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
          Write-Host "✅ Puma built successfully"
        shell: pwsh

      - name: Build Agentino
        if: hashFiles('3rdParty/Agentino/Build/CMake/CMakeLists.txt') != ''
        run: |
          cd 3rdParty/Agentino
          # Generate version files
          if (Test-Path "Build/Git/UpdateVersion.bat") {
            Write-Host "Generating version files for Agentino..."
            cmd /c "Build\Git\UpdateVersion.bat"
          }
          mkdir build -Force
          cd build
          cmake ../Build/CMake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
          Write-Host "✅ Agentino built successfully"
        shell: pwsh

      - name: Build ProLife
        run: |
          # Generate version files
          if (Test-Path "Build/Git/UpdateVersion.bat") {
            Write-Host "Generating version files for ProLife..."
            cmd /c "Build\Git\UpdateVersion.bat"
          }
          mkdir build -Force
          cd build
          cmake ../Build/CMake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
          Write-Host "✅ ProLife built successfully"
        shell: pwsh

      - name: Package Windows artifacts
        run: |
          mkdir artifacts -Force
          # Copy build artifacts from various possible locations
          if (Test-Path "Bin") {
            Write-Host "Copying from Bin directory..."
            Copy-Item -Path "Bin\*" -Destination "artifacts\" -Recurse -Force
          }
          if (Test-Path "build\bin") {
            Write-Host "Copying from build\bin directory..."
            Copy-Item -Path "build\bin\*" -Destination "artifacts\" -Recurse -Force
          }
          if (Test-Path "Lib") {
            Write-Host "Copying from Lib directory..."
            Copy-Item -Path "Lib\*" -Destination "artifacts\" -Recurse -Force
          }
          # Create archive even if directories are empty (for validation)
          if ((Get-ChildItem -Path "artifacts" -Recurse).Count -eq 0) {
            Write-Host "Warning: No artifacts found, creating empty archive"
            New-Item -Path "artifacts\README.txt" -ItemType File -Value "Windows build for ${{ inputs.target_tag }}" -Force
          }
          Compress-Archive -Path "artifacts\*" -DestinationPath "prolife-windows-${{ inputs.target_tag }}.zip"
          Write-Host "✅ Windows artifacts packaged"
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prolife-windows-${{ inputs.target_tag }}
          path: prolife-windows-${{ inputs.target_tag }}.zip
          retention-days: 90

      - name: Upload to Release
        if: inputs.dry_run == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.target_tag }}
          files: prolife-windows-${{ inputs.target_tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
